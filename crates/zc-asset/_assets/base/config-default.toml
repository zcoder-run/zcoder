# DO NOT EDIT - WILL BE UPDATED ON RESTART
# EDIT config-user.toml for customization/override

[workspace]
working_dir = "./"   # When relative, relative to cwd of the project_dir

[maestro]

model     = "$small"

[model_sizes]
# Addressed with `$` (model = "$small")
small     = "luna"
medium    = "luna-xhigh"
big       = "sol"

[model_aliases]
# -- Openai
astra         = "gpt-6-astra"
sol           = "gpt-6-sol"
gpt           = "gpt-6-sol"
luna          = "gpt-6-luna"
terra         = "gpt-5.6-terra"
# -- Anthropic
fable         = "claude-fable-5-1"
opus          = "claude-opus-5-5"
claude        = "claude-opus-5-5"
sonnet        = "claude-sonnet-5"
haiku         = "claude-haiku-4-5"
# -- google
flash         = "gemini-3.8-flash"
lite          = "gemini-3.5-flash-lite"
# -- kimi
kimi          = "kimi::kimi-k3"
kimi-fast     = "kimi::kimi-k2.7-code-highspeed"
# -- Qwen
qwen          = "qwen_cloud::qwen3.8-max"
# -- DeepSeek
dflash        = "deepseek-v4-flash"
dpro          = "deepseek-v4-pro"